{% extends "base.html" %}
{% load crispy_forms_filters %}


{% block content %}
  <form action="" method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p}}
    <button type="submit" class="btn btn-primary">
      {{ form.instance.pk|yesno:"Update, Create"}}
    </button>
  </form>
{% endblock %}
