{% extends "base.html" %}

{% block content %}
  <h1>Delete confirmation</h1>
  <p>Are you sure you want to delete this driver {{ driver }}?</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-primary" type="submit">Yes, delete</button>
    <a href="{% url "taxi:driver-detail" pk=object.pk %}" class="btn btn-primary">Cancel</a>
  </form>
{% endblock %}
